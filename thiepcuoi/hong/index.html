<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Thiệp cưới Ngọc Huy &amp; Hương Giang</title>
<link rel="canonical" href="https://huygiang.love/hong/">
<!-- Dự phòng cho trình duyệt tắt JavaScript. Thẻ này không mang theo được
     ?g= / ?x= nên chỉ về trang gốc; phần JS bên dưới mới giữ đủ tham số. -->
<meta http-equiv="refresh" content="4; url=https://huygiang.love/hong/">
<style>
  :root{ --paper:#fbf6f2; --ink:#4a3548; --body:#5b4a56; --rose:#9a4f6b; --gold:#8f6a28; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;padding:24px;
    background:var(--paper);color:var(--body);
    font:16px/1.6 "Cormorant Garamond",Georgia,serif;text-align:center;
  }
  .eyebrow{
    font-size:12px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--gold);text-indent:.34em;margin-bottom:1.1em;
  }
  h1{margin:0 0 .5em;font-size:clamp(19px,5vw,23px);font-weight:600;color:var(--ink);}
  .dom{
    margin:.1em 0 1.4em;font-size:clamp(22px,6.5vw,30px);
    color:var(--rose);letter-spacing:.01em;word-break:break-all;
  }
  a{
    display:inline-block;padding:.62em 1.5em;border-radius:999px;
    border:1px solid var(--rose);color:var(--rose);text-decoration:none;
  }
  a:hover{background:var(--rose);color:#fff}
  .note{margin-top:1.4em;font-size:13.5px;color:#9b8590;font-style:italic}
</style>
</head>
<body>
  <div>
    <div class="eyebrow">Ngọc Huy &amp; Hương Giang</div>
    <h1>Thiệp cưới đã chuyển sang địa chỉ mới</h1>
    <div class="dom">huygiang.love</div>
    <a id="go" href="https://huygiang.love/hong/">Mở thiệp &rarr;</a>
    <p class="note">Đang chuyển bạn sang trang mới…</p>
  </div>
<script>
(function(){
  var DICH = "https://huygiang.love/hong/";
  // Giữ nguyên ?g= (tên khách) và ?x= (xưng hô) để link cũ đã gửi vẫn mở
  // đúng thiệp riêng của từng người.
  var moi = DICH + location.search + location.hash;
  var go = document.getElementById("go");
  if(go) go.href = moi;
  // replace chứ không phải assign: khỏi kẹt nút Back giữa hai trang.
  location.replace(moi);
})();
</script>
</body>
</html>
